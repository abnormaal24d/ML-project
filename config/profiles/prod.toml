# Production_v1 release contract: optional tasks, blocked capabilities, and
# reproducibility policy. The release_requirements derived from this profile
# enforces the canonical production scope.
[release]
release_id = "production_v1"

optional_tasks = [
    "summarization",
    "information_extraction",
    "document_summarization",
    "audio_summarization",
    "video_summarization",
    "speech_translation",
    "scene_understanding",
    "scene_retrieval",
    "action_recognition",
]

[[release.blocked_capabilities]]
capability = "image_generation"
status = "blocked"
reason = "no production image generator/decoder; text_to_image stays out of scope"

[[release.blocked_capabilities]]
capability = "audio_generation"
status = "blocked"
reason = "no production audio tokenizer/vocoder; speech_to_audio stays out of scope"

[[release.blocked_capabilities]]
capability = "video_generation"
status = "blocked"
reason = "no production video generator/decoder; text_to_video stays out of scope"

[[release.blocked_capabilities]]
capability = "continuous_audio_tokens"
status = "blocked"
reason = "continuous audio tokenization is not supported in production"

[[release.blocked_capabilities]]
capability = "cross_modal_embedding_search"
status = "research_only"
reason = "multimodal_retrieval training stays required; serving-side embedding search stays out of production scope"

[[release.blocked_capabilities]]
capability = "emotion_mood_transfer"
status = "research_only"
reason = "emotion classification and synthesis stay out of production scope"

[[release.blocked_capabilities]]
capability = "speaker_recognition"
status = "research_only"
reason = "speaker identification and verification stay out of production scope"

[[release.blocked_capabilities]]
capability = "chart_understanding"
status = "research_only"
reason = "chart question answering and chart generation stay out of production scope"

[[release.blocked_capabilities]]
capability = "audio_image_document_scanning"
status = "research_only"
reason = "scanning audio/image sources for documents stays out of production scope"

[release.reproducibility]
seeds = [42, 43, 44]
require_deterministic_execution = true

[release.reproducibility.metric_tolerances]
validation_loss = 0.03
test_loss = 0.03

# Initial runtime limits, baseline only: calibrate from measured production
# runs before the release gate vouches for them.
[release.limits]
max_batch_latency_ms = 250
max_peak_memory_mb = 16384

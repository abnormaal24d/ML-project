task_sampling_weights = { text_pretrain = 1.0, instruction_following = 1.2, document_text_pair = 1.0, pdf_text_pair = 1.0, doc_qa = 1.2, image_text_pair = 1.0, ocr_parse = 1.2, vqa = 1.2, audio_text_pair = 1.0, audio_qa = 1.0, video_text_pair = 1.0, video_qa = 1.2, multimodal_retrieval = 1.0, cross_modal_consistency = 0.8 }
task_family_sampling_weights = { text = 1.5, document = 1.5, image = 1.2, audio = 1.0, video = 1.0, cross_modal = 0.8, retrieval = 0.8, multimodal_reasoning = 0.9 }
min_task_samples = { text_pretrain = 30000, instruction_following = 5000, document_text_pair = 10000, image_text_pair = 25000, audio_text_pair = 2000, video_text_pair = 500, pdf_text_pair = 5000, speech_translation = 0, summarization = 0, classification = 0, information_extraction = 0, doc_qa = 2500, document_summarization = 0, document_comparison = 0, table_extraction = 0, vqa = 2500, ocr_parse = 5000, speech_transcription = 0, audio_summarization = 0, audio_emotion = 0, audio_qa = 1000, video_qa = 500, video_summarization = 0, scene_understanding = 0, action_recognition = 0, multimodal_retrieval = 5000, cross_modal_consistency = 5000 }
disable_undercovered_tasks = false
drop_samples_with_invalid_targets = true
dynamic_sampling = true

